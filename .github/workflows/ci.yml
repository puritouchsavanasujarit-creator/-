# CI for ChatCraft: install from the committed lockfile, typecheck and build.
# A lockfile that drifted from package.json used to slip through unnoticed, so
# the frozen install is the first gate here.

name: CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check the agent FAQ against the playbook
        run: bun scripts/check-faq.mjs

      - name: Build
        run: bun run build
